<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مدیریت بارچین</title><style>
:root{color-scheme:dark;--bg:#07130f;--panel:#10231b;--line:#28523e;--green:#28c879;--muted:#a9c5b5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#123a29,var(--bg) 55%);color:#edf8f1;font-family:Tahoma,Arial,sans-serif;min-height:100vh;padding:24px}.wrap{max-width:1100px;margin:auto}.panel{background:#10231bee;border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 12px 40px #0005}h1,h2{margin-top:0}input,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid var(--line);background:#071a12;color:white}input{width:100%;margin:7px 0 14px}button{background:var(--green);color:#062013;border:0;font-weight:bold;cursor:pointer;margin:4px}button.secondary{background:#234634;color:white}button.danger{background:#a83e3e;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.hidden{display:none}.muted{color:var(--muted)}.msg{min-height:24px;color:#f5d58b}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:right;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}.scroll{overflow:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){body{padding:12px}.panel{padding:15px}}
</style></head><body><main class="wrap"><h1>مدیریت فروشگاه بارچین</h1><p class="muted">ورود امن مدیر · اطلاعات از دیتابیس مرکزی</p><section id="login" class="panel"><h2>ورود مدیر</h2><label>نام کاربری<input id="username" autocomplete="username"></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn">ورود</button><div id="loginMsg" class="msg" role="status"></div></section><section id="app" class="hidden"><div class="panel"><div class="tabs"><button data-tab="orders">سفارش‌ها</button><button data-tab="products">محصولات</button><button id="logout" class="secondary">خروج</button></div></div><section id="orders" class="panel"><h2>سفارش‌ها</h2><button id="refreshOrders" class="secondary">بروزرسانی</button><div class="scroll"><table><thead><tr><th>شماره</th><th>مشتری</th><th>تلفن</th><th>مبلغ</th><th>وضعیت</th><th>تغییر وضعیت</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section><section id="products" class="panel hidden"><h2>افزودن محصول مدیریتی</h2><div class="grid"><label>نام محصول<input id="pname"></label><label>قیمت (ریال)<input id="pprice" type="number" min="0"></label><label>موجودی<input id="pstock" type="number" min="0"></label></div><button id="addProduct">ثبت محصول</button><div id="productMsg" class="msg"></div><h2>فهرست محصولات</h2><div class="scroll"><table><thead><tr><th>شناسه</th><th>نام</th><th>قیمت</th><th>موجودی</th><th>عملیات</th></tr></thead><tbody id="productsBody"></tbody></table></div></section></section></main><script>
const $=id=>document.getElementById(id);async function api(path,opts={}){const r=await fetch('/api/admin/'+path,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})},credentials:'same-origin'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'خطا در ارتباط با سرور');return d}function showApp(on){$('login').classList.toggle('hidden',on);$('app').classList.toggle('hidden',!on)}async function loadOrders(){const d=await api('orders');$('ordersBody').innerHTML=d.orders.map(o=>`<tr><td>${o.id}</td><td>${esc(o.customer_name)}</td><td>${esc(o.phone)}</td><td>${Number(o.total_price).toLocaleString('fa-IR')}</td><td>${esc(o.status)}</td><td><select data-order="${o.id}"><option value="pending">در انتظار</option><option value="confirmed">تأیید</option><option value="processing">در حال آماده‌سازی</option><option value="shipped">ارسال‌شده</option><option value="completed">تکمیل</option><option value="cancelled">لغو</option></select><button data-save-order="${o.id}">ثبت</button></td></tr>`).join('')||'<tr><td colspan="6">هنوز سفارشی ثبت نشده است.</td></tr>';for(const o of d.orders){const s=document.querySelector(`[data-order="${o.id}"]`);if(s)s.value=o.status}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadProducts(){const d=await api('products');$('productsBody').innerHTML=d.products.map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${Number(p.price).toLocaleString('fa-IR')}</td><td>${p.stock}</td><td><button class="danger" data-delete-product="${p.id}">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">محصولی ثبت نشده است.</td></tr>'}async function enter(){showApp(true);await Promise.all([loadOrders(),loadProducts()])}$('loginBtn').onclick=async()=>{ $('loginMsg').textContent='';try{await api('login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});$('password').value='';await enter()}catch(e){$('loginMsg').textContent=e.message}};$('logout').onclick=async()=>{await api('logout',{method:'POST'});showApp(false)};$('refreshOrders').onclick=()=>loadOrders().catch(e=>alert(e.message));$('addProduct').onclick=async()=>{try{await api('products',{method:'POST',body:JSON.stringify({name:$('pname').value,price:Number($('pprice').value),stock:Number($('pstock').value)})});$('productMsg').textContent='محصول ثبت شد';$('pname').value='';$('pprice').value='';$('pstock').value='';await loadProducts()}catch(e){$('productMsg').textContent=e.message}};document.addEventListener('click',async e=>{if(e.target.dataset.saveOrder){const id=Number(e.target.dataset.saveOrder),status=document.querySelector(`[data-order="${id}"]`).value;try{await api('orders',{method:'PATCH',body:JSON.stringify({id,status})});await loadOrders()}catch(x){alert(x.message)}}if(e.target.dataset.deleteProduct){if(confirm('محصول حذف شود؟')){try{await api('products?id='+e.target.dataset.deleteProduct,{method:'DELETE'});await loadProducts()}catch(x){alert(x.message)}}}});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{['orders','products'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});api('me').then(d=>{if(d.ok)enter()}).catch(()=>{});
</script></body></html>
